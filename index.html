<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Eyker & Milena</title>
<style>
:root{--bg:#fff5f7;--card:#fff;--ink:#3a1f2b;--mut:#9a6b7b;--acc:#e8436f;--line:#f3d3dc;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root{--bg:#1d1217;--card:#2a1b22;--ink:#fbe8ee;--mut:#c79aab;--acc:#ff6b94;--line:#43282f}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh}
header{text-align:center;padding:28px 16px 12px}
h1{margin:0;font-size:26px;font-family:Georgia,serif}
h1 span{color:var(--acc)}
.sub{color:var(--mut);font-size:14px;margin-top:6px}
.stats{display:flex;justify-content:center;gap:18px;margin-top:12px;font-size:13px;color:var(--mut)}
.stats b{color:var(--ink);font-size:18px;display:block}
.tabs{display:flex;gap:8px;padding:8px 16px;overflow-x:auto}
.tabs button{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 14px;border-radius:99px;font-size:14px;white-space:nowrap}
.tabs button.on{background:var(--acc);border-color:var(--acc);color:#fff}
main{padding:8px 12px 110px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
@media(min-width:640px){.grid{grid-template-columns:repeat(5,1fr)}}
.it{position:relative;aspect-ratio:1;border-radius:12px;overflow:hidden;background:var(--line);cursor:pointer}
.it img,.it video{width:100%;height:100%;object-fit:cover;display:block}
.tag{position:absolute;left:6px;bottom:6px;background:rgba(0,0,0,.55);color:#fff;border-radius:8px;font-size:11px;padding:2px 6px}
.fav{position:absolute;right:6px;top:4px;font-size:16px}
.empty{text-align:center;color:var(--mut);padding:60px 24px;line-height:1.6}
.empty big{font-size:54px;display:block}
.add{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--acc);color:#fff;border:0;border-radius:99px;padding:15px 22px;font-size:16px;font-weight:600;box-shadow:0 6px 18px rgba(232,67,111,.4)}
#lb{position:fixed;inset:0;background:rgba(0,0,0,.94);display:none;flex-direction:column;z-index:10;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
#lb.open{display:flex}
#stage{flex:1;display:flex;align-items:center;justify-content:center;min-height:0}
#stage img,#stage video{max-width:100%;max-height:100%}
.bar{padding:12px 16px;color:#fff;display:flex;flex-direction:column;gap:10px}
.bar input{width:100%;padding:11px 12px;border-radius:10px;border:0;font-size:15px;background:#ffffff22;color:#fff}
.bar input::placeholder{color:#ffffffaa}
.row{display:flex;gap:8px;justify-content:space-between}
.row button{flex:1;padding:11px;border-radius:10px;border:0;font-size:15px;background:#ffffff22;color:#fff}
.row .del{background:#c0304f}
.date{font-size:12px;opacity:.7;text-align:center}
</style>
</head>
<body>
<header>
  <h1>Eyker <span>&amp;</span> Milena 💕</h1>
  <div class="sub">Nossos momentos, nossas felicidades</div>
  <div class="stats"><div><b id="nf">0</b>fotos</div><div><b id="nv">0</b>vídeos</div><div><b id="dias">–</b>dias juntos</div></div>
</header>
<div class="tabs" id="tabs">
  <button data-f="all" class="on">Tudo</button><button data-f="img">📷 Fotos</button><button data-f="vid">🎬 Vídeos</button><button data-f="fav">❤️ Favoritos</button>
</div>
<main><div class="grid" id="grid"></div><div class="empty" id="empty"><big>📸</big>Seu álbum está vazio.<br>Toque em <b>+ Adicionar</b> para guardar as primeiras memórias com a Milena.</div></main>
<input type="file" id="file" accept="image/*,video/*" multiple hidden>
<button class="add" id="addBtn">+ Adicionar</button>

<div id="lb">
  <div id="stage"></div>
  <div class="bar">
    <div class="date" id="ldate"></div>
    <input id="cap" placeholder="Escreva a legenda deste momento…" maxlength="140">
    <div class="row"><button id="bfav">🤍 Favoritar</button><button id="bdel" class="del">🗑 Apagar</button><button id="bclose">Fechar</button></div>
  </div>
</div>

<script>
(function(){
  var DB='album-milena',ST='midias',db=null,items=[],filter='all',cur=null,urls={};
  var $=function(id){return document.getElementById(id)};
  function startDate(){
    var s=null;try{s=localStorage.getItem('inicio')}catch(e){}
    if(!s){var r=prompt('Desde quando vocês estão juntos? (AAAA-MM-DD) — opcional');
      if(r&&/^\d{4}-\d{2}-\d{2}$/.test(r)){s=r;try{localStorage.setItem('inicio',s)}catch(e){}}}
    if(s){var d=Math.floor((Date.now()-new Date(s+'T00:00:00').getTime())/864e5);if(d>=0)$('dias').textContent=d}
  }
  function open(){return new Promise(function(res){
    try{var rq=indexedDB.open(DB,1);
      rq.onupgradeneeded=function(){rq.result.createObjectStore(ST,{keyPath:'id'})};
      rq.onsuccess=function(){db=rq.result;res()};
      rq.onerror=function(){res()};
    }catch(e){res()}})}
  function all(){return new Promise(function(res){
    if(!db)return res([]);
    try{var r=db.transaction(ST).objectStore(ST).getAll();r.onsuccess=function(){res(r.result||[])};r.onerror=function(){res([])}}catch(e){res([])}})}
  function put(o){return new Promise(function(res){
    if(!db)return res();
    try{var t=db.transaction(ST,'readwrite');t.objectStore(ST).put(o);t.oncomplete=res;t.onerror=res}catch(e){res()}})}
  function del(id){return new Promise(function(res){
    if(!db)return res();
    try{var t=db.transaction(ST,'readwrite');t.objectStore(ST).delete(id);t.oncomplete=res;t.onerror=res}catch(e){res()}})}
  function url(o){if(!urls[o.id])urls[o.id]=URL.createObjectURL(o.blob);return urls[o.id]}
  function fmt(t){return new Date(t).toLocaleDateString('pt-BR',{day:'2-digit',month:'long',year:'numeric'})}
  function render(){
    var list=items.filter(function(o){return filter==='all'||(filter==='fav'?o.fav:o.type===filter)}).sort(function(a,b){return b.date-a.date});
    var g=$('grid');g.innerHTML='';
    list.forEach(function(o){
      var d=document.createElement('div');d.className='it';
      var m=document.createElement(o.type==='vid'?'video':'img');
      m.src=url(o)+(o.type==='vid'?'#t=0.1':'');if(o.type==='vid'){m.preload='metadata';m.muted=true;m.playsInline=true}
      d.appendChild(m);
      if(o.type==='vid'){var t=document.createElement('span');t.className='tag';t.textContent='▶ vídeo';d.appendChild(t)}
      if(o.fav){var f=document.createElement('span');f.className='fav';f.textContent='❤️';d.appendChild(f)}
      d.onclick=function(){show(o)};g.appendChild(d)});
    $('empty').style.display=list.length?'none':'block';
    $('nf').textContent=items.filter(function(o){return o.type==='img'}).length;
    $('nv').textContent=items.filter(function(o){return o.type==='vid'}).length;
  }
  function show(o){
    cur=o;var s=$('stage');s.innerHTML='';
    var m=document.createElement(o.type==='vid'?'video':'img');m.src=url(o);
    if(o.type==='vid'){m.controls=true;m.playsInline=true}
    s.appendChild(m);$('ldate').textContent=fmt(o.date);$('cap').value=o.cap||'';
    $('bfav').textContent=o.fav?'❤️ Favorito':'🤍 Favoritar';$('lb').classList.add('open');
  }
  function close(){var v=$('stage').querySelector('video');if(v)v.pause();$('lb').classList.remove('open');cur=null}
  $('addBtn').onclick=function(){$('file').click()};
  $('file').onchange=function(e){
    var fs=Array.prototype.slice.call(e.target.files||[]);
    var p=fs.map(function(f,i){
      var o={id:Date.now()+'-'+i+'-'+Math.random().toString(36).slice(2,6),type:f.type.indexOf('video')===0?'vid':'img',blob:f,date:f.lastModified||Date.now(),cap:'',fav:false};
      items.push(o);return put(o)});
    Promise.all(p).then(render);e.target.value='';
  };
  $('bclose').onclick=close;
  $('cap').onchange=function(){if(cur){cur.cap=this.value;put(cur)}};
  $('bfav').onclick=function(){if(!cur)return;cur.fav=!cur.fav;put(cur);$('bfav').textContent=cur.fav?'❤️ Favorito':'🤍 Favoritar';render()};
  $('bdel').onclick=function(){
    if(!cur||!confirm('Apagar esta memória para sempre?'))return;
    var id=cur.id;items=items.filter(function(o){return o.id!==id});del(id);close();render()};
  $('tabs').onclick=function(e){
    var b=e.target.closest('button');if(!b)return;filter=b.dataset.f;
    Array.prototype.forEach.call($('tabs').children,function(x){x.classList.toggle('on',x===b)});render()};
  open().then(all).then(function(r){items=r;render();startDate()});
})();
</script>
</body>
  </html>
